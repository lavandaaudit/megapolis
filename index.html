<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>IBONARIUM RENDER</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html,body{
width:100%;
height:100%;
overflow:hidden;
background:#000;
font-family:'Inter',sans-serif;
color:white;
}

/* ===== VIEWER ===== */

.viewer{
position:relative;
width:100%;
height:100vh;
overflow:hidden;
background:black;
}

iframe{
width:100%;
height:100%;
border:none;
transition:1s;
filter:contrast(1.1);
}

/* ===== EFFECTS ===== */

.scan{
position:absolute;
inset:0;

background:
repeating-linear-gradient(
to bottom,
rgba(255,255,255,.02) 0px,
rgba(255,255,255,.02) 1px,
transparent 2px,
transparent 4px
);

opacity:.18;
mix-blend-mode:screen;

pointer-events:none;
}

.vignette{
position:absolute;
inset:0;

background:
radial-gradient(
circle at center,
transparent 35%,
rgba(0,0,0,.45)
);

pointer-events:none;
}

/* ===== TOPBAR ===== */

.topbar{
position:absolute;

top:10px;
left:50%;

transform:translateX(-50%);

width:98%;
height:58px;

background:rgba(0,0,0,.22);

backdrop-filter:blur(14px);

border:
1px solid rgba(255,255,255,.05);

border-radius:18px;

display:flex;
align-items:center;
gap:8px;

padding:0 12px;

overflow-x:auto;
scrollbar-width:none;

z-index:200;
}

.topbar::-webkit-scrollbar{
display:none;
}

/* ===== LOGO ===== */

.logo{
font-size:16px;
font-weight:900;
letter-spacing:1px;
white-space:nowrap;
margin-right:10px;
}

/* ===== SEARCH ===== */

.search{
width:180px;
height:34px;

background:#111;

border:none;
outline:none;

border-radius:10px;

padding:0 12px;

font-size:12px;
color:white;

flex:none;
}

/* ===== TOP BUTTON ===== */

.topbtn{
height:32px;

padding:0 12px;

background:rgba(0,0,0,.24);

backdrop-filter:blur(8px);

border:
1px solid rgba(255,255,255,.05);

border-radius:10px;

color:white;

font-size:9px;
font-weight:700;

cursor:pointer;

transition:.2s;

white-space:nowrap;

flex:none;
}

.topbtn:hover{
background:#1b1b1b;
}

/* ===== CITY POPUP ===== */

.city-popup{

position:absolute;

top:70px;
left:50%;

transform:translateX(-50%);

width:95%;
max-height:74vh;

overflow:auto;

padding:12px;

display:none;

grid-template-columns:
repeat(auto-fill,minmax(95px,1fr));

gap:6px;

background:rgba(0,0,0,.38);

backdrop-filter:blur(20px);

border:
1px solid rgba(255,255,255,.05);

border-radius:18px;

z-index:300;

scrollbar-width:none;
}

.city-popup::-webkit-scrollbar{
display:none;
}

/* ===== CITY ===== */

.city{
display:flex;
align-items:center;
justify-content:center;

height:34px;

font-size:9px;
font-weight:700;

background:rgba(255,255,255,.04);

border:
1px solid rgba(255,255,255,.04);

border-radius:10px;

cursor:pointer;

transition:.2s;

text-align:center;

padding:0 8px;
}

.city:hover{
background:#1b1b1b;
transform:scale(1.03);
}

/* ===== RIGHT INFO ===== */

.right{
position:absolute;

right:10px;
top:82px;

width:170px;

display:flex;
flex-direction:column;
gap:8px;

z-index:150;
}

/* ===== TITLE ===== */

.city-title{
font-size:18px;
font-weight:900;
line-height:1;

text-align:right;
}

/* ===== INFO ===== */

.info-line{
text-align:right;
line-height:1.45;
}

.label{
font-size:9px;
opacity:.45;
letter-spacing:1px;
}

.value{
font-size:14px;
font-weight:800;
}

.small{
font-size:10px;
opacity:.6;
}

/* ===== GUIDE ===== */

.guide{
margin-top:8px;

font-size:10px;
line-height:1.5;

text-align:right;

opacity:.75;
}

/* ===== STATUS ===== */

.walk{
position:absolute;

left:10px;
bottom:10px;

padding:10px 14px;

background:rgba(0,0,0,.24);

backdrop-filter:blur(10px);

border:
1px solid rgba(255,255,255,.05);

border-radius:12px;

font-size:10px;
line-height:1.5;

z-index:100;
}

/* ===== BIG CITY ===== */

.bigcity{
position:absolute;

right:18px;
bottom:18px;

font-size:40px;
font-weight:900;

opacity:.12;

pointer-events:none;
}

/* ===== MOBILE ===== */

@media(max-width:900px){

.right{
width:140px;
}

.bigcity{
display:none;
}

.search{
width:120px;
}

.city-popup{
grid-template-columns:
repeat(auto-fill,minmax(72px,1fr));
}

}

</style>
</head>

</button>

RANDOM
</button>

<button class="topbtn" onclick="nextCity()">

</button>

</button>

<button class="topbtn" onclick="stopWalk()">

</button>

</button>

CINEMA
</button>

MATRIX
</button>

CYBER
</button>

DRONE
</button>

</button>

</div>

<div

<div class="right">

<div

</div>

<div class="info-line">

</div>

<div class="info-line">

<div

</div>

<div
class="guide"

standby...

</div>

</div>

<div
class="walk"
id="walk">

AI SYSTEM ONLINE<br>
standby mode

</div>

<div
class="bigcity"

</div>

/* ===== ELEMENTS ===== */

const frame=document.getElementById('street');
const cityPopup=document.getElementById('cityPopup');

let currentIndex=0;
let autoWalkInterval=null;

/* ===== KEY ===== */

function cityKey(city){

return city
.replace(/\s/g,'')
.replace(/-/g,'');

}

/* ===== TOGGLE ===== */

function toggleCities(){

if(cityPopup.style.display==="grid"){

cityPopup.style.display="none";

}else{

cityPopup.style.display="grid";

renderCities(cities);

}

}

/* ===== RENDER ===== */

function renderCities(list){

cityPopup.innerHTML='';

list.forEach((city,index)=>{

const div=document.createElement('div');

div.className='city';

div.innerText=city;

div.onclick=()=>{

openStreet(city,index);

cityPopup.style.display="none";

};

cityPopup.appendChild(div);

});

}

/* ===== URL ===== */

function buildStreet(lat,lng,heading=0,zoom=0){

return `https://maps.google.com/maps?q=&layer=c&cbll=${lat},${lng}&cbp=11,${heading},0,${zoom},0&output=svembed`;

}

/* ===== OPEN ===== */

function openStreet(city,index){

currentIndex=index;

const key=cityKey(city);

const data=
cityData[key] || cityData["Tokyo"];

const lat=data.coords[0];
const lng=data.coords[1];

const rLat=
(lat+(Math.random()-.5)/500).toFixed(6);

const rLng=
(lng+(Math.random()-.5)/500).toFixed(6);

frame.src="about:blank";

setTimeout(()=>{

frame.src=
buildStreet(rLat,rLng);

},100);

document.getElementById('cityTitle').innerText=
city.toUpperCase();

document.getElementById('bigcity').innerText=
city.toUpperCase();

document.getElementById('temp').innerText=
data.temp;

document.getElementById('weatherText').innerText=
data.weather;

document.getElementById('air').innerText=
data.air;

document.getElementById('airText').innerText=
data.airText;

document.getElementById('population').innerText=
data.population;

}

/* ===== SEARCH ===== */

function filterCities(text){

const filtered=
cities.filter(c=>
c.toLowerCase().includes(text.toLowerCase())
);

renderCities(filtered);

cityPopup.style.display="grid";

}

/* ===== RANDOM ===== */
/* ===== FIXED ===== */
/* RANDOM NOW MOVES INSIDE CURRENT CITY */

function randomStreet(){

const city=
cities[currentIndex];

const key=
cityKey(city);

const data=
cityData[key] || cityData["Tokyo"];

const lat=data.coords[0];
const lng=data.coords[1];

/* BIGGER RANDOM AREA */

const rLat=
(lat+(Math.random()-.5)/80).toFixed(6);

const rLng=
(lng+(Math.random()-.5)/80).toFixed(6);

const headings=[0,45,90,135,180,225,270,315];

const heading=
headings[
Math.floor(Math.random()*headings.length)
];

const zooms=[0,1,2,3];

const zoom=
zooms[
Math.floor(Math.random()*zooms.length)
];

frame.src="about:blank";

setTimeout(()=>{

frame.src=
buildStreet(rLat,rLng,heading,zoom);

},100);

document.getElementById('guide').innerHTML=
`
RANDOM TELEPORT<br>
same megacity sector
`;

document.getElementById('walk').innerHTML=
`
LOCATION SHIFT<br>
new urban point
`;

}

/* ===== NEXT ===== */

function nextCity(){

currentIndex++;

if(currentIndex>=cities.length){

currentIndex=0;

}

openStreet(
cities[currentIndex],
currentIndex
);

}

/* ===== AUTO WALK ===== */

function autoWalk(){

clearInterval(autoWalkInterval);

document.getElementById('walk').innerHTML=
`
AUTO WALK ACTIVE<br>
urban navigation...
`;

autoWalkInterval=setInterval(()=>{

const city=
cities[currentIndex];

const key=
cityKey(city);

const data=
cityData[key] || cityData["Tokyo"];

const lat=data.coords[0];
const lng=data.coords[1];

const headings=[0,45,90,135,180,225,270,315];

const heading=
headings[
Math.floor(Math.random()*headings.length)
];

const zooms=[0,2,5];

const zoom=
zooms[
Math.floor(Math.random()*zooms.length)
];

const rLat=
(lat+(Math.random()-.5)/300).toFixed(6);

const rLng=
(lng+(Math.random()-.5)/300).toFixed(6);

frame.src=
buildStreet(rLat,rLng,heading,zoom);

const routes=[

"walking forward...",
"crossing avenue...",
"turning right...",
"moving through district...",
"approaching intersection...",
"navigating downtown...",
"scanning urban sector...",
"moving toward neon zone..."

];

const random=
routes[
Math.floor(Math.random()*routes.length)
];

document.getElementById('guide').innerHTML=
`
AI WALK<br>
${random}
`;

document.getElementById('walk').innerHTML=
`
AUTO WALK ACTIVE<br>
${random}
`;

},7000);

}

/* ===== STOP ===== */

function stopWalk(){

clearInterval(autoWalkInterval);

document.getElementById('walk').innerHTML=
`
AUTO WALK STOPPED<br>
manual control
`;

}

/* ===== FILTERS ===== */

function nightMode(){

frame.style.filter=
'brightness(.55) contrast(1.3) saturate(.8)';

}

function cinemaMode(){

frame.style.filter=
'contrast(1.2) saturate(1.25) brightness(.92)';

}

function matrixMode(){

frame.style.filter=
`
hue-rotate(90deg)
contrast(1.6)
brightness(.72)
saturate(1.8)
grayscale(.1)
`;

document.querySelector('.scan').style.opacity='.32';

}

function cyberpunkMode(){

frame.style.filter=
`
hue-rotate(-40deg)
saturate(1.9)
contrast(1.3)
brightness(.92)
`;

}

function droneMode(){

frame.style.filter=
`
grayscale(.35)
contrast(1.4)
brightness(.92)
`;

}

function infraMode(){

frame.style.filter=
`
sepia(.6)
contrast(1.5)
brightness(.9)
hue-rotate(-30deg)
saturate(2)
`;

}

function grainMode(){

frame.style.filter=
`
contrast(1.4)
brightness(.85)
saturate(.6)
blur(.3px)
`;

document.querySelector('.scan').style.opacity='.45';

}

function bwMode(){

frame.style.filter=
`
grayscale(1)
contrast(1.5)
brightness(.9)
`;

}

function neonMode(){

frame.style.filter=
`
saturate(2.2)
contrast(1.4)
brightness(.9)
hue-rotate(-15deg)
`;

}

function dreamMode(){

frame.style.filter=
`
brightness(1.1)
contrast(.9)
saturate(1.5)
blur(1px)
`;

}

}
